spring:
  application:
    name: sistema-adocao-pets-api

  datasource:
    url: jdbc:postgresql://localhost:5432/ong_pets_db
    username: postgres
    password: senha123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

api.security.token.secret: ${JWT_SECRET:minha-senha-secreta}