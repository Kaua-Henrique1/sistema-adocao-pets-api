server.port=0

# Configuração do Banco de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway desativado para o H2 recriar as tabelas dinamicamente no create-drop
spring.flyway.enabled=false

# Chave JWT para testes
api.security.token.secret=chave_secreta_para_testes_unitarios_123456

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# Força o Spring a usar cores no console (ANSI)
spring.output.ansi.enabled=always

# Adiciona cores exclusivas para as palavras-chave do banco (SELECT, INSERT, CREATE, etc)
spring.jpa.properties.hibernate.highlight_sql=true
# Mostra apenas avisos de erro para pacotes internos que poluem o console
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Mas mantém o nível INFO/DEBUG para o SEU código (troque para o seu pacote se precisar)
logging.level.devKaua.projeto=DEBUG