<div class="flex h-screen w-full bg-slate-50 font-sans text-slate-900 overflow-hidden">

  <!-- Sidebar Lateral Escura -->
  <aside class="w-64 bg-gradient-to-b from-neutral-900 to-black text-white border-r border-neutral-800 flex flex-col justify-between hidden md:flex shrink-0">
    <div>
      <!-- Logo da ONG na Sidebar -->
      <div class="h-16 flex items-center px-6 border-b border-neutral-800/80">
        <div class="flex items-center gap-3">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-neutral-800 p-1 border border-neutral-700/50 shadow-sm overflow-hidden">
            <img src="petsONGlogo.png" alt="Logo ONG Pets" class="w-full h-full object-cover rounded-full">
          </div>
          <span class="font-bold text-lg tracking-tight text-gray-100">ONG Pets</span>
        </div>
      </div>
      <!-- Links do Menu -->
      <nav class="p-4 space-y-1.5 mt-2">
        <p class="px-3 text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-2">Principal</p>

        <!-- Link: Dashboard -->
        <a routerLink="/home"
           routerLinkActive="bg-amber-500/10 text-amber-400 font-semibold border-r-2 border-amber-500"
           [routerLinkActiveOptions]="{exact: true}"
           class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-400 hover:bg-neutral-800/60 hover:text-gray-200 rounded-lg transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/>
            <rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
          </svg>
          Dashboard
        </a>

        <p class="px-3 text-[11px] font-semibold text-gray-500 uppercase tracking-wider mt-6 mb-2">Gerenciamento</p>

        <!-- Link: Pets Cadastrados -->
        <a routerLink="/pets"
           routerLinkActive="bg-amber-500/10 text-amber-400 font-semibold border-r-2 border-amber-500"
           class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-400 hover:bg-neutral-800/60 hover:text-gray-200 rounded-lg transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/>
            <path d="M9 10a5 5 0 0 1 5 5v3.5a2.5 2.5 0 0 1-5 0V15a5 5 0 0 1-5-5Z"/>
            <path d="M4.5 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5Z"/>
          </svg>
          Pets Cadastrados
        </a>

        <!-- Link: Adotantes -->
        <a routerLink="/pessoas"
           routerLinkActive="bg-amber-500/10 text-amber-400 font-semibold border-r-2 border-amber-500"
           class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-400 hover:bg-neutral-800/60 hover:text-gray-200 rounded-lg transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Adotantes
        </a>
      </nav>
    </div>

    <!-- Botão Sair -->
    <div class="p-4 border-t border-neutral-800/80">
      <button (click)="fazerLogout()" class="flex w-full items-center gap-3 px-3 py-2.5 text-sm text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-lg transition-colors font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
        </svg>
        Sair do Sistema
      </button>
    </div>
  </aside>

  <!-- Área Principal de Conteúdo (VOLTOU A SER CLARA) -->
  <main class="flex-1 flex flex-col overflow-y-auto relative bg-slate-50">
    <router-outlet></router-outlet>
  </main>

</div>
