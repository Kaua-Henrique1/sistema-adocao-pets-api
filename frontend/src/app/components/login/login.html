<div class="login-container">
  <h2>Acesso ao Sistema</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="login">Usuário / E-mail</label>
      <input
        id="login"
        type="text"
        formControlName="login"
        placeholder="Digite seu login"
      />
      <small class="error" *ngIf="loginForm.get('login')?.touched && loginForm.get('login')?.invalid">
        O campo login é obrigatório.
      </small>
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        formControlName="senha"
        placeholder="Digite sua senha"
      />
      <small class="error" *ngIf="loginForm.get('senha')?.touched && loginForm.get('senha')?.invalid">
        A senha deve ter pelo menos 6 caracteres.
      </small>
    </div>

    <div class="alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loginForm.invalid || isLoading">
      {{ isLoading ? 'Entrando...' : 'Entrar' }}
    </button>

  </form>
</div>
