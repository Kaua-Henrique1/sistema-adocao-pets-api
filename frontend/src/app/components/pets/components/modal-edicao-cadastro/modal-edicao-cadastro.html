@if (exibirModal) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
    <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">

      <!-- Cabeçalho -->
      <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
        <h3 class="text-lg font-semibold text-slate-800">
          {{ isEdicao ? 'Editar Pet #' + pet?.id : 'Novo Pet' }}
        </h3>
        <button
          type="button"
          (click)="onFechar()"
          class="text-slate-400 hover:text-slate-600 hover:bg-slate-200/50 p-1.5 rounded-full transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <!-- Formulário -->
      <form #formContainer #petForm="ngForm" (ngSubmit)="onSalvar()" class="p-6 max-h-[75vh] overflow-y-auto">
        <div class="space-y-4">

          <!-- Alerta de Erro de Validação Backend -->
          @if (mensagemErro) {
            <div class="p-3.5 rounded-2xl bg-red-50 border border-red-200/60 flex items-start gap-3 text-red-700 text-xs font-medium animate-in fade-in">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 mt-0.5">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" x2="12" y1="8" y2="12"/>
                <line x1="12" x2="12.01" y1="16" y2="16"/>
              </svg>
              <span>{{ mensagemErro }}</span>
            </div>
          }

          <!-- Alerta de Ajustes Automáticos na Higienização -->
          @if (avisosAjustes.length > 0) {
            <div class="p-3.5 rounded-2xl bg-amber-50 border border-amber-200/60 text-amber-800 text-xs font-medium animate-in fade-in">
              <span class="font-semibold block mb-1">Ajustes realizados automaticamente:</span>
              <ul class="list-disc list-inside space-y-0.5 text-amber-700">
                @for (aviso of avisosAjustes; track aviso) {
                  <li>{{ aviso }}</li>
                }
              </ul>
            </div>
          }

          <!-- Nome do Pet -->
          <div>
            <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1.5">Nome do Pet</label>
            <input
              type="text"
              name="nome"
              [(ngModel)]="formData.nome"
              required
              placeholder="Ex: Rex, Thor, Mel"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-slate-800 focus:ring-1 focus:ring-slate-800 outline-none transition-all text-sm text-slate-800" />
          </div>

          <!-- Tipo e Sexo -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1.5">
                Tipo / Espécie
                @if (isEdicao) {
                  <span class="text-[10px] text-slate-400 font-normal normal-case">(não alterável)</span>
                }
              </label>
              <select
                name="tipo"
                [(ngModel)]="formData.tipo"
                [disabled]="isEdicao"
                required
                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-slate-800 focus:ring-1 focus:ring-slate-800 outline-none transition-all text-sm text-slate-800 bg-white disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed">
                <option value="CACHORRO">Cachorro</option>
                <option value="GATO">Gato</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1.5">
                Sexo
                @if (isEdicao) {
                  <span class="text-[10px] text-slate-400 font-normal normal-case">(não alterável)</span>
                }
              </label>
              <select
                name="sexo"
                [(ngModel)]="formData.sexo"
                [disabled]="isEdicao"
                required
                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-slate-800 focus:ring-1 focus:ring-slate-800 outline-none transition-all text-sm text-slate-800 bg-white disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed">
                <option value="MACHO">Macho</option>
                <option value="FEMEA">Fêmea</option>
              </select>
            </div>
          </div>

          <!-- Raça, Peso e Data de Nascimento -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1.5">Raça</label>
              <input
                type="text"
                name="raca"
                [(ngModel)]="formData.raca"
                placeholder="Ex: Vira-lata"
                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-slate-800 focus:ring-1 focus:ring-slate-800 outline-none transition-all text-sm text-slate-800" />
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1.5">Peso (kg)</label>
              <input
                type="number"
                step="0.1"
                name="peso"
                [(ngModel)]="formData.peso"
                placeholder="Ex: 8.5"
                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-slate-800 focus:ring-1 focus:ring-slate-800 outline-none transition-all text-sm text-slate-800" />
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1.5">Nascimento</label>
              <input
                type="date"
                name="dataNascimento"
                [(ngModel)]="formData.dataNascimento"
                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-slate-800 focus:ring-1 focus:ring-slate-800 outline-none transition-all text-sm text-slate-800 bg-white" />
            </div>
          </div>

          <!-- Endereço / Localização -->
          <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 mt-2">
            <span class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-3">Endereço / Localização</span>
            <div class="space-y-3">
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">
                  CEP <span *ngIf="buscandoCep" class="text-[10px] text-slate-400 normal-case">(buscando...)</span>
                </label>
                <input
                  type="text"
                  name="cep"
                  [(ngModel)]="formData.endereco.cep"
                  (blur)="buscarCep()"
                  maxlength="9"
                  [disabled]="buscandoCep"
                  placeholder="00000-000"
                  class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:border-slate-800 focus:ring-1 focus:ring-slate-800 outline-none text-sm bg-white disabled:opacity-60" />
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Logradouro</label>
                <input
                  type="text"
                  name="logradouro"
                  [(ngModel)]="formData.endereco.logradouro"
                  placeholder="Rua, Avenida..."
                  class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:border-slate-800 focus:ring-1 focus:ring-slate-800 outline-none text-sm bg-white" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-medium text-slate-500 mb-1">Número</label>
                  <input
                    id="numeroPet"
                    type="text"
                    name="numero"
                    [(ngModel)]="formData.endereco.numero"
                    placeholder="Ex: 1000, 100A ou S/N"
                    class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:border-slate-800 focus:ring-1 focus:ring-slate-800 outline-none text-sm bg-white" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-500 mb-1">Cidade</label>
                  <input
                    type="text"
                    name="cidade"
                    [(ngModel)]="formData.endereco.cidade"
                    placeholder="Nome da cidade"
                    class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:border-slate-800 focus:ring-1 focus:ring-slate-800 outline-none text-sm bg-white" />
                </div>
              </div>
            </div>
          </div>

        </div>

        <!-- Botões de Ação -->
        <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-slate-100">
          <button
            type="button"
            (click)="onFechar()"
            class="px-5 py-2.5 rounded-full text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="petForm.invalid"
            class="px-6 py-2.5 rounded-full text-sm font-medium bg-slate-800 hover:bg-slate-900 disabled:opacity-50 text-white shadow-sm transition-colors">
            {{ isEdicao ? 'Salvar Alterações' : 'Cadastrar Pet' }}
          </button>
        </div>
      </form>

    </div>
  </div>
}
