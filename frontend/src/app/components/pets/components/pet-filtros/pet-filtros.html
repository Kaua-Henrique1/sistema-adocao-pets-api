<div class="flex flex-col md:flex-row flex-wrap justify-between items-center mb-6 gap-4">

  <!-- Alternância entre Disponíveis e Adotados (Status) -->
  <div class="flex items-center gap-2 w-full md:w-auto">
    <button
      [ngClass]="!exibindoAdotados ? 'bg-yellow-400 hover:bg-yellow-500 text-yellow-950 border-transparent shadow-sm' : 'bg-white hover:bg-slate-50 text-slate-600 border-slate-200'"
      class="border rounded-full px-5 py-2.5 text-sm font-medium transition-colors w-full md:w-auto text-center"
      (click)="carregarDisponiveis.emit()">
      Pets Disponíveis
    </button>

    <button
      [ngClass]="exibindoAdotados ? 'bg-yellow-400 hover:bg-yellow-500 text-yellow-950 border-transparent shadow-sm' : 'bg-white hover:bg-slate-50 text-slate-600 border-slate-200'"
      class="border rounded-full px-5 py-2.5 text-sm font-medium transition-colors w-full md:w-auto text-center"
      (click)="carregarAdotados.emit()">
      Pets Adotados
    </button>
  </div>

  <!-- Inputs de Busca e Botão de Limpar -->
  <div class="flex flex-col md:flex-row items-center gap-3 w-full md:w-auto">

    <!-- Busca por ID -->
    <div class="relative flex items-center bg-white rounded-full shadow-sm border border-slate-200 px-4 py-2 w-full md:w-36 focus-within:ring-2 focus-within:ring-yellow-400 focus-within:border-transparent transition-all">
      <!-- Ícone de Hash/Número -->
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400 mr-2 shrink-0">
        <line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line>
      </svg>
      <input
        type="number"
        [(ngModel)]="termoId"
        (keyup.enter)="buscarPorId()"
        placeholder="ID..."
        class="bg-transparent border-none outline-none text-sm w-full text-slate-700 placeholder:text-slate-400 appearance-none"
      />
    </div>

    <!-- Busca por Cidade -->
    <div class="relative flex items-center bg-white rounded-full shadow-sm border border-slate-200 px-4 py-2 w-full md:w-64 focus-within:ring-2 focus-within:ring-yellow-400 focus-within:border-transparent transition-all">
      <!-- Ícone de Mapa/Localização -->
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400 mr-2 shrink-0">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>
      </svg>
      <input
        type="text"
        [(ngModel)]="termoCidade"
        (keyup.enter)="buscarPorCidade()"
        placeholder="Buscar por cidade..."
        class="bg-transparent border-none outline-none text-sm w-full text-slate-700 placeholder:text-slate-400"
      />
    </div>

    <!-- Botão de Limpar -->
    <button (click)="onLimpar()" class="bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 rounded-full px-4 py-2 text-sm font-medium shadow-sm transition-colors w-full md:w-auto whitespace-nowrap">
      Limpar
    </button>

  </div>
</div>
