<div class="container mx-auto p-4 sm:p-6 max-w-7xl space-y-6">

  <!-- Cabeçalho Principal -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
    <div>
      <h2 class="text-2xl font-bold tracking-tight text-slate-800">
        Gestão de Pets
      </h2>
      <p class="text-xs text-slate-400 font-normal mt-0.5">
        Gerencie o cadastro, edições e adoções dos animais cadastrados
      </p>
    </div>

    <button
      type="button"
      (click)="abrirModalNovoPet()"
      class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full bg-slate-800 hover:bg-slate-900 active:scale-95 text-white text-sm font-medium shadow-sm hover:shadow transition-all duration-150 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Cadastrar Pet</span>
    </button>
  </div>

  <!-- Banners Globais com estilo Tailwind -->
  @if (mensagemSucesso) {
    <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200/60 text-emerald-800 text-sm font-medium flex items-center gap-3 animate-in fade-in">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-emerald-600">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span>{{ mensagemSucesso }}</span>
    </div>
  }

  @if (mensagemErro) {
    <div class="p-4 rounded-2xl bg-red-50 border border-red-200/60 text-red-800 text-sm font-medium flex items-center gap-3 animate-in fade-in">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-red-600">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" x2="12" y1="8" y2="12"/>
        <line x1="12" x2="12.01" y1="16" y2="16"/>
      </svg>
      <span>{{ mensagemErro }}</span>
    </div>
  }

  <!-- Filtros -->
  <app-pet-filtros
    [exibindoAdotados]="exibindoAdotados"
    (carregarDisponiveis)="carregarDisponiveis()"
    (carregarAdotados)="carregarAdotados()"
    (buscarCidade)="buscarPorCidade($event)"
    (buscarId)="buscarPorId($event)"
    (limparFiltros)="carregarDisponiveis()">
  </app-pet-filtros>

  <!-- Tabela -->
  <app-pet-tabela
    [pets]="pets"
    [carregando]="carregando"
    [exibindoAdotados]="exibindoAdotados"
    [paginaAtual]="paginaAtual"
    [totalPaginas]="totalPaginas"
    (verDetalhes)="abrirModalDetalhes($event)"
    (adotar)="petSelecionadoAdocao = $event; exibirModalAdocao = true"
    (editar)="abrirModalEditarPet($event)"
    (remover)="deletarPet($event)"
    (mudarPagina)="paginaAtual = $event; atualizarLista()">
  </app-pet-tabela>

  <!-- Modais -->
  @if (exibirModalDetalhes) {
    <app-modal-detalhes
      [pet]="petSelecionadoDetalhes"
      [tutor]="tutorDetalhes"
      [exibindoAdotados]="exibindoAdotados"
      (fechar)="exibirModalDetalhes = false">
    </app-modal-detalhes>
  }

  <app-modal-edicao-cadastro
    [exibirModal]="exibirModalEdicaoCadastro"
    [pet]="petSelecionadoEdicao"
    [mensagemErro]="mensagemErro"
    (salvar)="salvarPet($event)"
    (fechar)="fecharModalEdicaoCadastro()">
  </app-modal-edicao-cadastro>

  @if (exibirModalAdocao && petSelecionadoAdocao) {
    <app-modal-adocao
      [pet]="petSelecionadoAdocao"
      (confirmar)="adotarPet($event)"
      (fechar)="exibirModalAdocao = false">
    </app-modal-adocao>
  }

</div>
